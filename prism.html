<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Prism</title>
<style>
:root{
  --bg:#fbfaf7; --card:#fff; --ink:#1c1b19; --sub:#6b6862; --line:#e2ded6;
  --accent:#7a5c33; --accent-bg:#f2ece1; --danger:#b3261e; --ok:#2e6b3e;
  --miss:#9a968e; --gap:#c9c4ba;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171614; --card:#211f1c; --ink:#eae7e1; --sub:#a29d94; --line:#37342f;
         --accent:#d9b98a; --accent-bg:#2c261d; --danger:#f2b8b5; --ok:#8fd0a1;
         --miss:#7a766f; --gap:#4a463f; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px; display:flex; align-items:baseline; gap:8px;
  position:sticky; top:0; z-index:20;
}
header b{font-size:17px}
header small{color:var(--sub); font-size:11px; flex:1}
header a.hlink{color:var(--accent); text-decoration:none; font-size:12px; white-space:nowrap;
  border:1px solid var(--line); border-radius:6px; padding:3px 7px}
nav{display:flex; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:19}
nav button{
  flex:1; min-width:0; border:0; background:none; color:var(--sub); font:inherit; font-size:14px;
  padding:9px 2px; border-bottom:2px solid transparent; cursor:pointer;
}
nav button.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
main{padding:12px 12px 60px; max-width:760px; margin:0 auto}
section{display:none}
section.on{display:block}
h2{font-size:16px; margin:0 0 10px}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:9px}
.card.tap{cursor:pointer}
.row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.sub{color:var(--sub); font-size:12.5px}
.tag{display:inline-block; font-size:11px; color:var(--accent); background:var(--accent-bg);
  border-radius:5px; padding:1px 6px; margin:0 4px 3px 0; white-space:nowrap}
.tag.plain{color:var(--sub); background:transparent; border:1px solid var(--line)}
.tag.tap{cursor:pointer}
.term{font-size:20px; line-height:1.45; word-break:break-word}
.reading{color:var(--sub); font-size:13.5px}
.reading .added{color:var(--accent)}
.ja{font-size:14px}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
button.btn{font:inherit; font-size:14px; padding:7px 12px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink)}
button.btn.pri{background:var(--accent); color:var(--card); border-color:var(--accent)}
button.btn.warn{color:var(--danger); border-color:var(--danger)}
input[type=text],input[type=search],input[type=date],textarea,select{
  font:inherit; font-size:16px; width:100%; padding:8px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--ink)}
textarea{min-height:90px; line-height:1.5}
textarea.code{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; min-height:150px}
.langblock{border-top:1px solid var(--line); padding:9px 0 3px}
.langblock:first-of-type{border-top:0}
.langname{font-size:12px; color:var(--sub); letter-spacing:.02em; margin-bottom:3px}
.state{font-size:13px; padding:3px 0}
.state.gap{color:var(--gap)}
.state.miss{color:var(--miss)}
.state.none{color:var(--miss)}
.state b{font-weight:600}
.srcline{font-size:11.5px; color:var(--sub); margin-top:2px}
.srcline button{background:none;border:0;color:var(--accent);font:inherit;font-size:11.5px;
  padding:0;text-decoration:underline;cursor:pointer}
.entry{padding:5px 0 7px}
.entry + .entry{border-top:1px dashed var(--line)}
.msg{font-size:13px; padding:8px 0; white-space:pre-wrap}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
#warn{position:fixed; left:0; right:0; bottom:0; background:var(--danger); color:#fff;
  font-size:13px; padding:8px 12px; display:none; z-index:50}
.legend{font-size:11.5px; color:var(--sub); border:1px dashed var(--line); border-radius:8px;
  padding:7px 9px; margin-bottom:10px}
.legend span{display:inline-block; margin-right:10px}
details{border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:9px; background:var(--card)}
summary{cursor:pointer; font-size:14px}
pre{overflow-x:auto; font-size:12px; background:var(--bg); padding:8px; border-radius:6px}
.empty{color:var(--sub); font-size:14px; padding:18px 2px}
img.page{max-width:100%; border:1px solid var(--line); border-radius:8px}
.mini{font-size:12px; color:var(--sub)}
.flag{font-size:12px; color:var(--danger); margin-top:3px; line-height:1.5}
.kindmark{font-size:11px; color:var(--accent); background:var(--accent-bg);
  display:inline-block; border-radius:5px; padding:1px 6px; margin-bottom:3px}
.solo{font-size:11.5px; color:var(--sub)}
.ghead{font-size:12px; color:var(--sub); letter-spacing:.04em; font-weight:600;
  margin:16px 2px 7px; padding-bottom:4px; border-bottom:1px solid var(--line)}
#themeList .ghead:first-child{margin-top:2px}
/* 語タブの段。畳んだ見出しは押せるので、少し大きく取る */
details.sect{border:0; background:none; padding:0; margin:0 0 4px}
details.sect > summary.ghead{margin:10px 2px 0; padding:10px 2px; font-size:14px;
  color:var(--ink); cursor:pointer}
details.sect[open] > summary.ghead{color:var(--accent)}
hr{border:0; border-top:1px solid var(--line); margin:16px 0}
/* コレクション(2026-09-12)。既存のカード・余白・文字サイズをそのまま使う */
.colitem{display:flex; gap:8px; align-items:center; padding:9px 2px; border-top:1px solid var(--line)}
.colitem:first-of-type{border-top:0}
.iconbtn{border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit;
  font-size:15px; line-height:1.1; border-radius:8px; padding:6px 10px; cursor:pointer}
.iconbtn[disabled]{opacity:.35; cursor:default}
.iconbtn.warn{color:var(--danger); border-color:var(--danger)}
.iconbtn.on{color:var(--accent); border-color:var(--accent); background:var(--accent-bg)}
.colgrid{display:block}
/* 広い画面（iPad・折りたたみ）ではカードを並べる。狭い画面は今までどおり1列 */
@media(min-width:700px){
  .colgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:9px}
  .colgrid > .card{margin-bottom:0}
}
/* ズレの候補(2026-09-11) */
.sameterm{font-size:12.5px; color:var(--sub); margin-top:4px}
.sameterm .tag{font-size:12.5px; padding:3px 8px}
.chip{display:inline-block; font:inherit; font-size:13px; padding:5px 10px; border-radius:14px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); margin:0 5px 6px 0; cursor:pointer}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--card)}
.riftrow{display:flex; gap:8px; align-items:baseline; padding:8px 2px; border-top:1px solid var(--line); cursor:pointer}
.riftrow:first-of-type{border-top:0}
</style>
</head>
<body>

<header>
  <b id="appName">Prism</b>
  <small>身近な単語から観察する</small>
  <a class="hlink" id="atlasLink" href="./assimil-phrasebook.html">▶ Atlas</a>
</header>

<nav>
  <button id="tabThemes"   onclick="showTab('Themes')">テーマ</button>
  <button id="tabWords"    onclick="showTab('Words')">語</button>
  <button id="tabCollections" onclick="showTab('Collections')">集める</button>
  <button id="tabMemos"    onclick="showTab('Memos')">メモ</button>
  <button id="tabSettings" onclick="showTab('Settings')">設定</button>
</nav>

<main>

<section id="pageThemes">
  <div id="themeList"></div>
</section>

<section id="pageWords">
  <div style="margin-bottom:10px"><input type="search" id="q" placeholder="意味・原語・読みで探す" oninput="renderWords()"></div>
  <div id="wordList"></div>
</section>

<section id="pageCollections">
  <div id="colList"></div>
</section>

<section id="pageMemos">
  <div id="memoList"></div>
</section>

<section id="pageSettings">
  <h2>本</h2>
  <div class="sub" style="margin-bottom:6px">取り込んだ本と、その見開き。語の出典行からも開けます。</div>
  <div id="bookList"></div>

  <hr>
  <h2>取り込み</h2>
  <div class="sub" style="margin-bottom:6px">ChatGPTで起こしたJSONを貼って「取り込む」。同じ本・同じテーマは差し替えになります。</div>
  <textarea id="impText" class="code" placeholder='{"source":{...},"bookTheme":{...},"items":[...]}'></textarea>
  <div class="row" style="margin:8px 0">
    <button class="btn pri" onclick="doImport()">取り込む</button>
    <button class="btn" onclick="doUndo()">直前の取り込みを戻す</button>
  </div>
  <div class="row" style="margin:0 0 8px">
    <button class="btn" onclick="loadBundled()">同梱データ（prism-data.json）を読み込む</button>
  </div>
  <div class="sub" style="margin-bottom:8px">
    大きいJSONをスマホに貼るのは無理があるので、アプリと同じ場所に置いたファイルから読みます。</div>
  <div id="impMsg" class="msg"></div>

  <details>
    <summary>形式（ChatGPTに依頼するとき用）</summary>
    <div id="fmtHelp"></div>
  </details>

  <!-- 元ページの画像は撤去した(2026-09-09)。ページ数は各語の出典行に出ている。
       戻すなら、この節と renderImgPicker() / imgFile のリスナーを復活させる。
  <hr>
  <h2>元ページの画像</h2>
  <div class="sub" style="margin-bottom:6px">普段は使いません。確認したいページだけ入れてください。</div>
  <div class="row" style="margin-bottom:6px">
    <select id="imgBt" class="grow"></select>
  </div>
  <input type="file" id="imgFile" accept="image/*" style="font-size:14px">
  <div id="imgMsg" class="msg"></div>
  <div id="imgList" style="margin-top:8px"></div>
  -->

  <hr>
  <h2>書き出し・バックアップ</h2>
  <div class="row">
    <button class="btn" onclick="doExport()">全データをJSONで保存</button>
    <button class="btn" onclick="doExportAtlas()">Atlas用の下書きを作る</button>
  </div>
  <div id="expMsg" class="msg"></div>

  <hr>
  <h2>言語の表示順</h2>
  <div id="langOrder"></div>

  <hr>
  <h2>保存の状態</h2>
  <div id="storeInfo" class="sub"></div>
  <div class="row" style="margin-top:8px">
    <button class="btn" onclick="loadDemo()">デモデータを入れる</button>
    <button class="btn warn" onclick="wipeAll()">全部消す</button>
  </div>
</section>

<section id="pageSense">
  <button class="back" onclick="goBack()">‹ 戻る</button>
  <div id="senseBody"></div>
</section>

<section id="pageBookTheme">
  <button class="back" onclick="goBack()">‹ 戻る</button>
  <div id="btBody"></div>
</section>

<section id="pageRift">
  <button class="back" onclick="goBack()">‹ 戻る</button>
  <div id="riftBody"></div>
</section>

<section id="pageCollection">
  <button class="back" onclick="goBack()">‹ 戻る</button>
  <div id="colBody"></div>
</section>

<section id="pageImage">
  <button class="back" onclick="goBack()">‹ 戻る</button>
  <div id="imgBody"></div>
</section>

</main>

<div id="warn"></div>

<script>
/* ===========================================================
   Prism — 身近な単語から観察する多言語比較アプリ
   ひとつの意味を通すと、言語ごとに違う色に分かれて出てくる。
   Language Atlas (assimil-phrasebook.html) とは別アプリ。
   保存先も別 (IndexedDB "prismDB")。Atlasのデータには触らない。
   =========================================================== */
const BUILD = "2026-09-12i";
const KEY   = "prism.v1";
const IDB_NAME = "prismDB", IDB_VER = 1, ST_DB = "db", ST_IMG = "img";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Atlasと同じ自己表記に揃える（◇概念リンクと言語名の突合のため） */
const NATIVE = {
  "英語":"English","中国語":"中文","イタリア語":"Italiano","スペイン語":"Español",
  "フランス語":"Français","ドイツ語":"Deutsch","トルコ語":"Türkçe","アラビア語":"العربية",
  "ヒンディー語":"हिन्दी","インドネシア語":"Bahasa Indonesia","タイ語":"ไทย","ロシア語":"Русский",
  "オランダ語":"Nederlands","ベトナム語":"Tiếng Việt","ポルトガル語":"Português","韓国語":"한국어",
  "日本語":"日本語","हिंदी":"हिन्दी"
};
function toNative(l){ return NATIVE[String(l||"").trim()] || String(l||"").trim(); }

/* テーマ一覧の並べ方（2026-09-09）。内容ごとにまとめて出す。
   ここに書いていないテーマは末尾の「その他」に落ちる。**消えない**ので、
   素材に新しいテーマが来たら、ここへ足すだけでよい。
   並べ替えたいときはこの配列を書き換える。 */
const THEME_GROUPS = [
  {name:"数と時",     note:"", themes:["数字","時間","月日と年月","1年と天気"]},
  {name:"身のまわり", note:"", themes:["色・買い物","街歩き/散歩"]},
  {name:"人と話す",   note:"", themes:["あいさつ","自己紹介","呼びかけ","人間関係"]},
  {name:"語のはたらき", note:"", themes:["形容詞","動詞・疑問詞"]},
  {name:"Atlasの◇と同じ軸",
   note:"上のテーマの一部を切り出したもの。Atlasの◇へ行き来するための入口。",
   themes:["数","曜日","月"]}
];

/* Atlasに◇概念として実在するtopic（2026-09-06時点）。
   ここに一致する共通テーマ名だけ、Atlasへのリンクを出す。 */
const ATLAS_CONCEPTS = ["-ment","ことわざ","なまり","丁寧さ","句動詞","名前","場所と方向",
                        "家族","接続法","数","時間","曜日","月","過去","遠さ"];
const ATLAS_URL = "./assimil-phrasebook.html";

/* ---------- データの形 ----------
db = {
  savedAt,
  langs:      ["Italiano", ...],                      // 表示順・自己表記
  sources:    [{id,title,kind,lang,edition,note}],    // 本
  themes:     [{id,name,atlas,note,notes[]}],         // 横断用の共通テーマ
              // notes: [{lang,status,note}] 「その本にはこのテーマのページが無い」など。
              //        未取り込みとも「載っていない」とも違う第4の状態。
  bookThemes: [{id,sourceId,name,page,themeIds[],note}], // 本ごとのテーマ分類（そのまま保持）
  senses:     [{id,name,key,solo,order,note,themeIds[]}], // 比較の軸（意味）
  entries:    [{id,senseId,lang,term,reading,readingSrc,readingStatus,ja,note,
                sourceId,bookThemeId,page,status,kind,flags[],reviewNote,numeric,srcId}],
  memos:      [{id,tType,tId,text,at}],
  collections:[{id,title,date,note,items:[senseId],at,updated}],  // 比較項目を束ねるだけ。語は複製しない
  activeCol:  "",  // いま集めているコレクションのid。一覧に＋が出るだけで、他には効かない
  images:     [{id,sourceId,bookThemeId,page,name,at,url}]  // url があれば配信ファイルを見る
}
solo: 共通の比較キーが付いていない項目（その資料だけの語）。比較軸と混ぜない。
kind: "term" | "pattern"（構文枠・記入枠。単語として読ませない）
readingStatus: "" = 読みあり / "not_transcribed" = まだ写していない
              "not_required" = その言語には要らない（Atlasの方針。尼・英・西・伊）
              "mixed_review" = 言語が混在していて保留
readingLevel: "reused"（既存辞書のまま）/ "rules"（規則で組み立て・＋）/ "draft"（新規判断・校閲前・＊）
※ いま入っている読みは原語から付けたAtlas式のローマ字。紙面のカナ読みはまだ写していない。
status: "present" | "absent_in_source" | "no_expression"
  present            … 資料にこの語が載っていた
  absent_in_source   … その資料を見たが、この意味は載っていなかった
  no_expression      … 「その言語には対応する表現がない」と資料が述べている（noteに根拠）
  レコードそのものが無い … まだ取り込んでいない（＝何も分かっていない）
------------------------------------- */
function emptyDb(){
  return {savedAt:0, langs:[], sources:[], themes:[], bookThemes:[],
          senses:[], entries:[], memos:[], images:[], collections:[], activeCol:""};
}
let db = emptyDb();

const sid  = s => "s:" + s;
const tid  = s => "t:" + s;
const btid = (src,name) => "bt:" + src + "/" + name;
const eid  = (src,lang,sn,term) => "e:" + src + "/" + lang + "/" + sn + "/" + (term||"");
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const byId = (arr,id) => arr.find(x => x.id === id);
const theme = id => byId(db.themes,id);
const sense = id => byId(db.senses,id);
const source = id => byId(db.sources,id);
const bookTheme = id => byId(db.bookThemes,id);

/* ---------- 保存 ---------- */
const STORE = {mode:"?", lastOk:0, lastErr:"", lsOk:true, bytes:0};

function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function warnBar(msg){
  const w = $("warn");
  if(!msg){ w.style.display="none"; return; }
  w.textContent = msg; w.style.display="block";
}
function idbOpen(){
  return new Promise((res,rej)=>{
    let r;
    try{ r = indexedDB.open(IDB_NAME, IDB_VER); }catch(e){ return rej(e); }
    r.onupgradeneeded = () => {
      const h = r.result;
      if(!h.objectStoreNames.contains(ST_DB))  h.createObjectStore(ST_DB);
      if(!h.objectStoreNames.contains(ST_IMG)) h.createObjectStore(ST_IMG);
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
/* IndexedDBに入れるのは必ず「文字列」。オブジェクトを入れると
   読み出しのJSON.parseが落ちて、空のdbが本物を上書きする（Atlasで実際に起きた事故）。 */
async function idbPut(store, key, val){
  const h = await idbOpen();
  await new Promise((res,rej)=>{
    const tx = h.transaction(store,"readwrite");
    tx.objectStore(store).put(val,key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  h.close();
}
async function idbGet(store, key){
  const h = await idbOpen();
  const v = await new Promise((res,rej)=>{
    const tx = h.transaction(store,"readonly");
    const q  = tx.objectStore(store).get(key);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
  h.close(); return v;
}
async function idbDel(store, key){
  const h = await idbOpen();
  await new Promise((res,rej)=>{
    const tx = h.transaction(store,"readwrite");
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  h.close();
}

let saveTimer = null;
function save(){
  db.savedAt = Date.now();
  const text = JSON.stringify(db);
  STORE.bytes = text.length;
  STORE.lsOk = lsSet(KEY, text);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await idbPut(ST_DB,"main",text);
      STORE.mode = "IndexedDB"; STORE.lastOk = Date.now(); STORE.lastErr = "";
      warnBar("");
    }catch(e){
      STORE.mode = "localStorageのみ"; STORE.lastErr = String(e && e.message || e);
      if(!STORE.lsOk) warnBar("保存できていません: " + STORE.lastErr);
    }
    if($("pageSettings").classList.contains("on")) renderStore();
  }, 120);
}
async function bootStorage(){
  let here = null, there = null;
  try{ here = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  try{
    const t = await idbGet(ST_DB,"main");
    if(typeof t === "string") there = JSON.parse(t);
    STORE.mode = "IndexedDB";
  }catch(e){ STORE.mode = "localStorageのみ"; STORE.lastErr = String(e && e.message || e); }
  const pick = (a,b) => (b && (b.savedAt||0) >= ((a&&a.savedAt)||0)) ? b : a;
  const d = pick(here, there);
  db = normalizeDb(d || emptyDb());
  labelIndex = null; entryIndex = null; termIndex = null;
  try{ STORE.bytes = JSON.stringify(db).length; }catch(e){}
  if(STORE.mode !== "IndexedDB")
    warnBar("IndexedDBが使えません。localStorageは約5MBで一杯になります。設定→書き出しでこまめに控えを取ってください。");
}
function normalizeDb(d){
  const e = emptyDb();
  for(const k in e) if(Array.isArray(e[k]) && !Array.isArray(d[k])) d[k] = [];
  for(const k in e) if(!(k in d)) d[k] = e[k];
  return d;
}

  TABS.forEach(t=>{

    $("tab"+t).classList.toggle("on", t===name);

/* 同じ日本語ラベルを持つ意味どうしの索引（2026-09-10）。
   個別項目3041件のうち837件は、他の本にも同じラベルで存在している
   （「クリスマス」は8言語）。素材が比較キーを付けていないだけなので、
   **統合はせず**、行き来できるようにするためだけに使う。
   素材の指示: 同じ日本語ラベルというだけで統合・削除しない。 */
let labelIndex = null;
function labelMap(){
  if(labelIndex) return labelIndex;
  labelIndex = new Map();
  db.senses.forEach(s=>{
    if(!labelIndex.has(s.name)) labelIndex.set(s.name, []);
    labelIndex.get(s.name).push(s.id);
  });
  return labelIndex;
}
function sameLabel(id){
  const s = sense(id); if(!s) return [];
  return (labelMap().get(s.name) || []).filter(x => x !== id).map(sense).filter(Boolean);
}
/* そのラベルの一群が、合わせて何言語ぶんあるか */
function labelGroupLangs(id){
  const set = new Set();
  [sense(id)].concat(sameLabel(id)).forEach(x =>
    x && entriesOf(x.id).forEach(e => { if(e.status === "present") set.add(e.lang); }));
  return set;
}
/* 意味 → 語 の索引(2026-09-10)。
   毎回 db.entries(6千件)を舐めていて、テーマ一覧の描画が1.2秒かかっていた。
   取り込みのたびに捨てて作り直す。 */
let entryIndex = null;
function entryMap(){
  if(entryIndex) return entryIndex;
  entryIndex = new Map();
  db.entries.forEach(e=>{
    if(!entryIndex.has(e.senseId)) entryIndex.set(e.senseId, []);
    entryIndex.get(e.senseId).push(e);
  });
  return entryIndex;
}
function entriesOf(senseId, lang){
  const es = entryMap().get(senseId) || [];
  return lang ? es.filter(e => e.lang === lang) : es;
}
/* 同じ言語の同じ綴りが、日本語の別々の見出しに出てくるかの索引(2026-09-11)。
   Multilingual Observations の記事のために「一語で複数の意味」を見つける。
   **同じ綴り＝同じ語とは限らない**（同音異義もある）。候補として見せるだけで、何も統合しない。
   構文枠と「〜」「□」を含む枠は語ではないので数えない。
   索引は entryIndex と同じく、取り込み・undo・全消去・起動で null に戻す。 */
let termIndex = null;
function normTerm(t){
  return String(t||"").normalize("NFC").trim().toLowerCase().replace(/\s+/g," ")
    .replace(/^[¿¡"“「]+|[?？!！。.,、"”」]+$/g,"").trim();
}
function termKey(e){
  if(e.status !== "present" || e.kind === "pattern" || /[〜~□…]/.test(e.term||"")) return "";
  const t = normTerm(e.term);
  return t ? e.lang + "\u0001" + t : "";
}
function termMap(){
  if(termIndex) return termIndex;
  termIndex = new Map();
  db.entries.forEach(e=>{
    const k = termKey(e); if(!k) return;
    if(!termIndex.has(k)) termIndex.set(k, new Set());
    termIndex.get(k).add(e.senseId);
  });
  return termIndex;
}
/* その語と同じ綴りが出てくる、別の見出しの意味。同じ見出しの別項目は「同じ日本語ラベルの語」で出ているので除く */
function sameTermSenses(e){
  const k = termKey(e); if(!k) return [];
  const cur = (sense(e.senseId)||{}).name, seen = new Set([cur]);
  return [...(termMap().get(k)||[])].map(sense)
    .filter(o => o && !seen.has(o.name) && seen.add(o.name));
}
/* 見出しの言い回しが違うだけに見えるか（「寒い」と「寒い・冷たい」、「3」と「時計の3の読み」）。
   機械的な判定。一覧で下にまとめるのに使うだけで、消さない。
   1文字の断片（「日・日間」の「日」）では判定しない。「昼」と「日」がつながってしまうため。 */
function labelBits(n){ return String(n).split(/[・／\/（）()、,\s？?！!]+/).filter(Boolean); }
function labelsOverlap(a, b){
  const x = String(a).replace(/[？?！!]+$/,""), y = String(b).replace(/[？?！!]+$/,"");
  if(x.includes(y) || y.includes(x)) return true;
  return labelBits(a).some(t => t.length >= 2 && b.includes(t))
      || labelBits(b).some(t => t.length >= 2 && a.includes(t));
}
/* 一語で複数の意味: {lang, key, senses[], weak}。weak＝見出しが重なるものだけでできている */
function riftMany(){
  const out = [];
  termMap().forEach((set, k)=>{
    if(set.size < 2) return;
    const ss = [...set].map(sense).filter(Boolean);
    const names = [...new Set(ss.map(s => s.name))];
    if(names.length < 2) return;
    let cl = [];
    names.forEach(n=>{
      const hit = cl.filter(c => c.some(m => labelsOverlap(n, m)));
      cl = cl.filter(c => !hit.includes(c)).concat([[n].concat(...hit)]);
    });
    out.push({lang: k.split("\u0001")[0], key: k, senses: ss, weak: cl.length < 2});
  });
  return out;
}
/* 1つの意味を分けている: 同じ意味・同じ言語・**同じ本**に、綴りの違う語が2つ以上ある。
   本をまたぐ違いは数えない(2026-09-12)。仏独西伊は指さし会話帳とDK5言語辞典の2冊に載っていて、
   「il mese ／ 〜 mesi」のような**本の載せ方の違い**が108件ある。言語が言い分けているのとは別のこと。
   戻すなら、本ごとに分けずに lang だけで数える。 */
function splitLangs(senseId){
  const by = new Map();
  entriesOf(senseId).forEach(e=>{
    if(e.status !== "present" || !e.term) return;
    const k = e.lang + "\u0001" + (e.sourceId || "");
    const t = normTerm(e.term);
    if(!by.has(k)) by.set(k, new Map());
    const m = by.get(k); if(!m.has(t)) m.set(t, e);
  });
  const out = [];
  by.forEach((m, k)=>{
    if(m.size < 2) return;
    const p = k.split("\u0001");
    out.push({lang: p[0], srcId: p[1], es: [...m.values()]});
  });
  return out;
}
function riftSplit(){
  const out = [];
  db.senses.forEach(s=>{ const ls = splitLangs(s.id); if(ls.length) out.push({s, langs: ls}); });
  return out;
}
/* 「N言語」の数え方: 語が実際にあった言語だけを数える。
   未掲載・対応語なしは「調べた結果」であって語ではないので数に入れない。 */
/* 比較画面に並べる言語。
   「未取り込み（まだ調べていない）」は、その言語の本に同じテーマのページがあるときだけ意味を持つ。
   共通キーの無い個別項目(solo)や、本を持たない併記ラベルにまで出すと、
   「調べていない」と「そもそも比較対象にしていない」が混ざる。 */
/* その言語・そのテーマについて「本にページが無い」と分かっているか。
   未取り込み（まだ調べていない）とは別の状態なので、区別して出す。 */
function themeNoteFor(senseId, lang){
  const tIds = (sense(senseId)||{}).themeIds || [];
  for(const tid_ of tIds){
    const t = theme(tid_); if(!t) continue;
    const n = (t.notes||[]).find(x => x.lang === lang);
    if(n) return n;
  }
  return null;
}
function naLabel(n){
  return n.status === "no_compiled_page_in_source"
    ? "この本には、このテーマをまとめたページが無い"
    : "この本では扱いが違う（" + (n.status||"") + "）";
}
function langsForSense(senseId){
  const sn = sense(senseId) || {};
  const have = new Set(entriesOf(senseId).map(e=>e.lang));
  if(sn.solo) return db.langs.filter(l => have.has(l));
  const tIds = sn.themeIds || [];
  const expected = new Set();
  db.bookThemes.forEach(bt=>{
    if(!(bt.themeIds||[]).some(t => tIds.includes(t))) return;
    const src = source(bt.sourceId);
    if(src && src.lang) expected.add(src.lang);
  });
  (tIds||[]).forEach(t0=>{
    const t = theme(t0);
    (t && t.notes || []).forEach(n => { if(n.lang) expected.add(n.lang); });
  });
  const out = db.langs.filter(l => have.has(l) || expected.has(l));
  return out.length ? out : db.langs.filter(l => have.has(l));
}
function langsOf(senseId){
  const s = new Set(entriesOf(senseId).filter(e=>e.status==="present").map(e=>e.lang));
  return db.langs.filter(l => s.has(l));
}
function themeTags(ids, clickable){

/* 読みの状態。「無い」「不要」「まだ写していない」「保留」を分ける。
   いま入っている読みは Atlas式のローマ字で、原語から付けたもの。
   **紙面のカナ読みの転記ではない**（カナ読みは紙面にあるが、まだ写していない）。 */
const READ_MARK = {
  reused: ["",  ""],
  rules:  ["＋", "Atlas式の規則で組み立てた読み"],
  draft:  ["＊", "新しく音を判断した読み。校閲前"]
};
function readingHtml(e){
  if(e.reading){
    const m = READ_MARK[e.readingLevel] || ["", ""];
    return '<div class="reading">' + esc(e.reading)
      + (m[0] ? ' <span class="added" title="'+esc(m[1])+'">'+m[0]+'</span>' : '')
      + '</div>'
      + (e.readingNote ? '<div class="sub">読みについて: '+esc(e.readingNote)+'</div>' : '');
  }
  if(e.readingStatus === "not_required") return "";   // Atlasの方針で読み不要
  if(e.readingStatus === "mixed_review"){
    let h = '<div class="reading" style="color:var(--gap)">読みは保留（言語が混在している）</div>';
    (e.readingParts||[]).forEach(pt=>{
      h += '<div class="sub">' + esc(pt.lang) + ': ' + esc(pt.text)
        + (pt.reading ? ' — ' + esc(pt.reading) : ' — 読みなし（この言語の記法が無い）') + '</div>';
    });
    return h;
  }
  if(e.readingStatus === "not_transcribed")
    return '<div class="reading" style="color:var(--gap)">読み未転記</div>';
  return "";
}
/* 紙面がそのまま正しいとは限らない箇所。**原典を書き換えずに、横に並べる。**
   - normalizedText: 紙面の綴りと標準の綴りが違う（伊 diciasette / diciassette）
   - sourceNumeric / verifiedNumeric: 紙面の数値と確認した値（西 un billón）
   - headword / gender: 紙面の見出し表記と性。term には見出し語だけが入っている（独） */
const ASPECT = {perfective:"完了体", imperfective:"不完了体"};
const REGISTER = {
  informal: "くだけた言い方",
  very_informal: "かなりくだけた言い方",
  vulgar: "下品・侮蔑にあたる語（原典の収録）",

function sourceFormHtml(e){

function flagsHtml(e){

function entryHtml(e){

function themeCard(t){

function renderThemes(){
  const el = $("themeList");
  if(!db.themes.length){
    el.innerHTML = '<div class="empty">まだテーマがありません。設定タブからJSONを取り込んでください。</div>';
    return;
  }
  const byName = new Map(db.themes.map(t => [t.name, t]));
  const used = new Set();
  let h = "";
  THEME_GROUPS.forEach(g=>{
    const ts = g.themes.map(n => byName.get(n)).filter(Boolean);
    if(!ts.length) return;
    ts.forEach(t => used.add(t.id));
    h += '<div class="ghead">'+esc(g.name)+'</div>'
      + (g.note ? '<div class="sub" style="margin:-4px 2px 7px">'+esc(g.note)+'</div>' : '')
      + ts.map(themeCard).join("");
  });
  const rest = db.themes.filter(t => !used.has(t.id));
  if(rest.length){
    h += '<div class="ghead">その他</div>'
      + '<div class="sub" style="margin:-4px 2px 7px">まだ分類していないテーマ。'
      + 'prism.html の THEME_GROUPS に足すと上に入る。</div>'
      + rest.map(themeCard).join("");
  }
  el.innerHTML = h;
}

/* ---------- 語（意味）一覧 ---------- */
/* 意味カード1枚。ラベル一致の一群は、その一群の原語をまとめて見せる。 */
function senseCard(s, mode){
  let ls, preview, right;
  if(mode === "label"){
    const grp = [s].concat(sameLabel(s.id));
    const terms = [];
    grp.forEach(x => entriesOf(x.id).forEach(e => {
      if(e.status === "present" && e.term && terms.length < 5) terms.push(e.term);
    }));
    preview = terms.join(" ・ ");
    right = labelGroupLangs(s.id).size + "言語（ラベル一致）";
  } else {
    ls = langsOf(s.id);
    preview = ls.slice(0,4).map(l=>{
      const e = entriesOf(s.id,l).filter(x=>x.status==="present")[0];
      return e ? esc(e.term) : "";
    }).filter(Boolean).join(" ・ ") + (ls.length>4 ? " …" : "");
    right = s.solo ? "この資料のみ" : ls.length + "言語";
  }
  return '<div class="card tap" onclick="openSense(\''+esc(s.id)+'\')">'
    + '<div class="row"><b class="grow">'+esc(s.name)+'</b>'
    + '<span class="sub">'+esc(right)+'</span>' + colPlusHtml(s.id) + '</div>'
    + (preview ? '<div class="sub" style="font-size:13.5px">'+preview+'</div>' : '')
    + '</div>';
}
/* テーマ一覧の3段組み。
   比較軸 → 同じ日本語ラベルで並ぶ語 → この本だけの語（本ごとに畳む） */
function sectionedList(list){
  const axis = [], label = [], only = [];
  list.forEach(s=>{
    if(!s.solo){ axis.push(s); return; }
    (labelGroupLangs(s.id).size >= 2 ? label : only).push(s);
  });
  /* 3つの段を畳む(2026-09-11にMayの依頼)。
     動詞・疑問詞は177枚、自己紹介は156枚あって、開いた瞬間から延々スクロールしていた。
     テーマを開くと3行だけ出て、読みたい段をタップして開く。
     戻すなら fold() を「見出し＋中身をそのまま返す」に変える。 */
  /* 小さいテーマまで畳むと、無駄に1タップ増える。
     段が1つしかないとき（曜日7・月12など）と、比較軸が20枚以下のときは開いておく。 */
  const nSect = (axis.length?1:0) + (label.length?1:0) + (only.length?1:0);
  const fold = (name, n, note, body, open) =>
    '<details class="sect"'+((nSect===1 || open) ? ' open' : '')
    + '><summary class="ghead">'+esc(name)+' '+n+'</summary>'
    + (note ? '<div class="sub" style="margin:6px 2px 7px">'+note+'</div>' : '')
    + body + '</details>';

  let h = "";
  if(axis.length)
    h += fold("比較軸", axis.length,
      '素材が同じ比較キーを付けた語。言語をまたいで並ぶ。',
      axis.map(s=>senseCard(s,"axis")).join(""), axis.length <= 20);
  if(label.length){
    /* ラベルが同じものは1枚にまとめて出す。代表は最初の1件。 */
    const seen = new Set(); const cards = [];
    label.forEach(s=>{
      if(seen.has(s.id)) return;
      [s].concat(sameLabel(s.id)).forEach(x => x && seen.add(x.id));
      cards.push(senseCard(s,"label"));
    });
    h += fold("同じ日本語ラベルで並ぶ語", cards.length,
      '比較キーは付いていない。<b>紙面の日本語ラベルが同じというだけ</b>で、同義とは限らない。',
      cards.join(""));
  }
  if(only.length){
    const byBook = new Map();
    only.forEach(s=>{
      const e = entriesOf(s.id)[0];
      const k = e ? e.sourceId : "";
      if(!byBook.has(k)) byBook.set(k, []);
      byBook.get(k).push(s);
    });
    let inner = "";
    [...byBook.entries()]
      .sort((a,b)=> b[1].length - a[1].length)
      .forEach(([sid_, ss])=>{
        const src = source(sid_) || {title:"?"};
        inner += '<details><summary>'+esc(src.title)+' <span class="sub">'+ss.length+'</span></summary>'
          + '<div style="margin-top:8px">' + ss.map(s=>senseCard(s,"axis")).join("") + '</div>'
          + '</details>';
      });
    h += fold("この本だけの語", only.length,
      '他の本に同じラベルの語が無いもの。本ごとにたたんである。', inner);
  }
  return h || '<div class="empty">該当なし。</div>';
}
function renderWords(){
  const q = ($("q").value||"").trim().toLowerCase();

  /* 意味が2790件まで増えて、全件を出すと描画が重くなった(2026-09-07にMayの提案で変更)。
     テーマで絞っているか、検索しているときだけ一覧を出す。
     戻すなら、この if ブロックを消せば全件表示に戻る。 */
  if(!themeFilter && !q){
    $("wordList").innerHTML =
      '<div class="empty">' + db.senses.length + ' の意味があります。<br>'
      + '上の欄で探すか、「テーマ」タブから開いてください。</div>'
      + riftCardHtml();
    return;
  }

  let list = db.senses.slice();
  if(themeFilter) list = list.filter(s => (s.themeIds||[]).includes(themeFilter));
  if(q) list = list.filter(s => {
    if(s.name.toLowerCase().includes(q)) return true;
    return entriesOf(s.id).some(e =>
      (e.term||"").toLowerCase().includes(q) ||
      (e.reading||"").toLowerCase().includes(q) ||
      (e.ja||"").toLowerCase().includes(q));
  });
  const head = themeFilter
    ? '<div class="row" style="margin-bottom:8px"><b class="grow">'
      + esc((theme(themeFilter)||{}).name||"") + '</b>'
      + '<button class="btn" onclick="themeFilter=\'\';renderWords()">テーマを外す</button></div>'
      + (atlasLinkFor((theme(themeFilter)||{}).name) ? '<div style="margin-bottom:8px">'
         + atlasLinkFor((theme(themeFilter)||{}).name) + '</div>' : '')
    : "";
  const bar = colBarHtml();
  const barHtml = bar ? '<div class="row" id="colBar" style="margin-bottom:9px">'+bar+'</div>' : "";
  const byOrder = (a,b)=>{
    const ao = a.order==null ? 1e9 : a.order, bo = b.order==null ? 1e9 : b.order;
    if(ao !== bo) return ao - bo;
    return String(a.name).localeCompare(String(b.name), "ja");
  };
  list.sort((a,b)=>{
    if(!!a.solo !== !!b.solo) return a.solo ? 1 : -1;
    return byOrder(a,b);
  });

  /* テーマを開いたときは3段に分ける(2026-09-10)。
     フラットな381件だと、比較軸が個別項目に埋もれて見えなくなる。
     検索中は結果が少ないので分けない。戻すなら下の if を false にする。 */
  if(themeFilter && !q){
    $("wordList").innerHTML = head + barHtml + sectionedList(list);
    return;
  }

  /* 検索結果でも、同じ日本語ラベルの語は1枚にまとめる。
     「クリスマス」で8枚並ぶより、8言語ぶんが1枚に見えるほうが読める。 */
  const seen = new Set(); const cards = [];
  list.forEach(s0=>{
    if(seen.has(s0.id)) return;
    if(s0.solo && labelGroupLangs(s0.id).size >= 2){
      [s0].concat(sameLabel(s0.id)).forEach(x => x && seen.add(x.id));
      cards.push(senseCard(s0, "label"));
    }else{
      seen.add(s0.id);
      cards.push(senseCard(s0, "axis"));
    }
  });
  const nKeyed = list.filter(x=>!x.solo).length;
  const countLine = '<div class="sub" style="margin-bottom:8px">'
    + cards.length + ' 件（比較軸 ' + nKeyed + '）</div>';
  $("wordList").innerHTML = head + barHtml + countLine
    + (cards.length ? cards.join("") : '<div class="empty">該当なし。</div>');
}

function renderSense(id){
  const s = sense(id);
  if(!s){ $("senseBody").innerHTML = '<div class="empty">見つかりません。</div>'; return; }
  const tnames = (s.themeIds||[]).map(i=>(theme(i)||{}).name).filter(Boolean);
  let h = '<div class="row" style="margin-bottom:4px"><h2 class="grow" style="margin:0">'+esc(s.name)+'</h2></div>';
  h += '<div style="margin-bottom:8px">' + themeTags(s.themeIds,true)
     + tnames.map(atlasLinkFor).join("") + '</div>';
  h += colBoxHtml(id);   /* コレクションに入れる(2026-09-12)。閲覧の邪魔にならないよう畳んである */
  if(s.note) h += '<div class="sub" style="margin-bottom:8px">'+esc(s.note)+'</div>';
  /* 対になる語（近い⇄遠い など）。素材が対のキーを持っていて、
     こちらにもその意味があるときだけ出す。すべての用法で反対語という意味ではない。 */
  const opp = [...new Set(entriesOf(id).map(e=>e.opposite).filter(Boolean))]
    .map(k => sense(sid(k))).filter(Boolean);
  if(opp.length) h += '<div style="margin-bottom:8px">' + opp.map(o =>
      '<span class="tag tap" onclick="openSense(\''+esc(o.id)+'\')">⇄ '+esc(o.name)+'</span>'
    ).join("") + '</div>';
  if(s.solo){
    h += '<div class="card" style="border-style:dashed"><b>共通の比較キーは付いていません。</b>'
      + '<div class="sub">この資料の中の項目として取り込んだものです。'
      + '他の言語の似た語と並べるかどうかは、まだ判断していません。</div></div>';
  }else if(s.key && s.key !== s.name){
    h += '<div class="sub" style="margin-bottom:8px">比較キー: <code>'+esc(s.key)+'</code>'
      + '（素材側の仮キー。厳密な同義を保証するものではありません）</div>';
  }
  /* 同じ日本語ラベルの語(2026-09-10)。比較キーが付いていないだけで、
     他の本に同じラベルの語があることが多い。**統合はしない。**
     戻すなら下のブロックを消す。 */
  const same = sameLabel(id);
  if(same.length){
    const rows = [];
    same.forEach(o => entriesOf(o.id).forEach(e=>{
      if(e.status !== "present" || !e.term) return;
      rows.push('<div class="entry" style="cursor:pointer" onclick="openSense(\''+esc(o.id)+'\')">'
        + '<div class="langname">'+esc(e.lang)+'</div>'
        + '<div class="term" style="font-size:17px">'+esc(e.term)+'</div>'
        + readingHtml(e)
        + '<div class="srcline">'+esc((source(e.sourceId)||{}).title||"")+'</div></div>');
    }));
    if(rows.length){
      h += '<h2 style="margin:14px 0 6px">同じ日本語ラベルの語</h2>'
        + '<div class="sub" style="margin-bottom:6px">比較キーは付いていない。'
        + '<b>紙面の日本語ラベルが「'+esc(s.name)+'」で同じというだけ</b>で、'
        + '同義とは限らない。押すとその語へ移る。</div>'
        + '<div class="card">' + rows.join("") + '</div>';
    }
  }

  h += LEGEND;
  h += '<div class="card">';
  langsForSense(id).forEach(l=>{
    const es = entriesOf(id,l);
    /* この言語が、この意味を2つ以上の語で言い分けているとき(2026-09-11)。
       同じ本の中で数える(2026-09-12。本をまたぐ違いは「本の載せ方の違い」なので別のこと) */
    const byBook = new Map();
    es.forEach(e=>{ if(e.status !== "present" || !e.term) return;
      if(!byBook.has(e.sourceId)) byBook.set(e.sourceId, new Set());
      byBook.get(e.sourceId).add(normTerm(e.term)); });
    const nSplit = byBook.size ? Math.max(...[...byBook.values()].map(x => x.size)) : 0;
    h += '<div class="langblock"><div class="langname">'+esc(l)
      + (nSplit >= 2 ? ' <span class="tag plain">'+nSplit+'通りに言い分け</span>' : '') + '</div>';
    if(es.length){ h += es.map(entryHtml).join(""); }
    else {
      const na = themeNoteFor(id, l);
      h += na
        ? '<div class="state miss">' + esc(naLabel(na)) + '</div>'
          + (na.note ? '<div class="sub">'+esc(na.note)+'</div>' : '')
        : '<div class="state gap">未取り込み（まだ調べていない）</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  h += memoBox("sense", id);
  $("senseBody").innerHTML = h;
}

/* ---------- ズレの候補(2026-09-11) ----------
   Multilingual Observations の記事のため、言語の分け方の違いをデータから拾う。
   どちらも機械的に拾った「候補」。ズレかどうかはMayが見て決める。何も統合・削除しない。 */
let riftMode = "many", riftLang = "", riftScroll = 0;
function riftCardHtml(){
  if(!db.entries.length) return "";
  const nm = riftMany().filter(x => !x.weak).length, ns = riftSplit().length;
  return '<div class="card tap" onclick="openRift()"><b>ズレの候補</b>'
    + '<div class="sub">一語で複数の意味 '+nm+' ／ 1つの意味を言い分けている '+ns+'</div></div>';
}
function riftSet(mode, lang){ riftMode = mode; riftLang = lang; riftScroll = 0; renderRift(); window.scrollTo(0,0); }
function riftGo(id){ riftScroll = window.scrollY; openSense(id); }
function riftManyCard(x){
  const first = x.senses.map(s => entriesOf(s.id, x.lang).find(e => termKey(e) === x.key)).find(Boolean);
  const seen = new Set(), rows = [];
  x.senses.forEach(s=>{
    if(seen.has(s.name)) return; seen.add(s.name);
    const e = entriesOf(s.id, x.lang).find(v => termKey(v) === x.key);
    const tn = (s.themeIds||[]).map(i => (theme(i)||{}).name).filter(Boolean).join("・");
    rows.push('<div class="riftrow" onclick="riftGo(\''+esc(s.id)+'\')">'
      + '<div class="grow"><b>'+esc(s.name)+'</b>'
      + (e && e.ja && e.ja !== s.name ? ' <span class="sub">'+esc(e.ja)+'</span>' : '')
      + (tn ? '<div class="sub">'+esc(tn)+'</div>' : '') + '</div><span class="sub">›</span></div>');
  });
  return '<div class="card"><div class="row"><span class="term grow">'+esc(first ? first.term : "")+'</span>'
    + '<span class="sub">'+esc(x.lang)+'</span></div>'
    + (first ? readingHtml(first) : '') + rows.join("") + '</div>';
}
function riftSplitCard(x){
  const ls = riftLang ? x.langs.filter(v => v.lang === riftLang) : x.langs;
  return '<div class="card"><div class="row tap" style="cursor:pointer" onclick="riftGo(\''+esc(x.s.id)+'\')">'
    + '<b class="grow">'+esc(x.s.name)+'</b><span class="sub">'+x.langs.length+'言語が言い分け ›</span></div>'
    + ls.map(v => '<div class="langblock"><div class="langname">'+esc(v.lang)
        + '<span class="sub"> ／ '+esc((source(v.srcId)||{}).title||"")+'</span></div>'
        + v.es.map(e => '<div><span style="font-size:16px">'+esc(e.term)+'</span>'
            + (e.ja && e.ja !== x.s.name ? ' <span class="sub">'+esc(e.ja)+'</span>' : '') + '</div>').join("")
        + '</div>').join("")
    + '</div>';
}
function renderRift(){
  const many = riftMany(), split = riftSplit();
  const cand = many.filter(x => !x.weak), weak = many.filter(x => x.weak);
  const order = l => { const i = db.langs.indexOf(l); return i < 0 ? 999 : i; };
  let h = '<h2 style="margin:0 0 6px">ズレの候補</h2>'
    + '<div class="sub" style="margin-bottom:10px">データから機械的に拾ったもの。'
    + '<b>ズレかどうかは見て判断する。</b>何も統合・削除していない。</div>'
    + '<div class="row" style="margin-bottom:10px">'
    + '<button class="btn'+(riftMode==="many"?" pri":"")+'" onclick="riftSet(\'many\',\'\')">一語で複数の意味 '+cand.length+'</button>'
    + '<button class="btn'+(riftMode==="split"?" pri":"")+'" onclick="riftSet(\'split\',\'\')">1つの意味を言い分け '+split.length+'</button>'
    + '</div>';
  const counts = new Map();
  if(riftMode === "many") cand.forEach(x => counts.set(x.lang, (counts.get(x.lang)||0) + 1));
  else split.forEach(x => x.langs.forEach(v => counts.set(v.lang, (counts.get(v.lang)||0) + 1)));
  h += '<div style="margin-bottom:6px">'
    + '<button class="chip'+(riftLang?"":" on")+'" onclick="riftSet(riftMode,\'\')">すべて</button>'
    + [...counts.keys()].sort((a,b)=>order(a)-order(b)).map(l =>
        '<button class="chip'+(riftLang===l?" on":"")+'" onclick="riftSet(riftMode,\''+esc(l)+'\')">'
        + esc(l)+' '+counts.get(l)+'</button>').join("")
    + '</div>';

  if(riftMode === "many"){
    h += '<div class="sub" style="margin-bottom:10px">同じ言語の同じ綴りが、日本語の別々の見出しに出てくるもの。'
      + '1つの語が日本語の2つの意味にまたがっている候補。<b>同じ綴りの別の語（同音異義）</b>や、'
      + '本による見出しの付け方の違い（「はじまる」と「始まる」）も混ざる。</div>';
    const byLang = (a,b) => order(a.lang) - order(b.lang) || a.key.localeCompare(b.key);
    const pick = arr => arr.filter(x => !riftLang || x.lang === riftLang).sort(byLang);
    const c = pick(cand), w = pick(weak);
    let last = "";
    c.forEach(x=>{
      if(!riftLang && x.lang !== last){ h += '<div class="ghead">'+esc(x.lang)+'</div>'; last = x.lang; }
      h += riftManyCard(x);
    });
    if(!c.length) h += '<div class="empty">該当なし。</div>';
    if(w.length)
      h += '<details style="margin-top:12px"><summary>見出しの言い回しが違うだけに見えるもの <span class="sub">'+w.length+'</span></summary>'
        + '<div class="sub" style="margin:6px 0 8px">「寒い」と「寒い・冷たい」、「3」と「時計の3の読み」のように、'
        + '片方の見出しがもう片方を含むもの。機械的な判定なので、ここにも面白いものが紛れうる。</div>'
        + w.map(riftManyCard).join("") + '</details>';
  } else {
    h += '<div class="sub" style="margin-bottom:10px">1つの意味に、同じ言語で綴りの違う語が2つ以上載っているもの。'
      + '数・性別・丁寧さなどで言い分けている候補。<b>同じ本の中で</b>数えている（本をまたぐ違いは入れない）。'
      + '<b>本が別の言い方を並べただけ</b>のものも混ざる。'
      + '構文枠（「〜」を含む形）も入れている。ロシア語の「3・4」と「5以上」の分け方などがそこに出るため。</div>';
    const list = split.filter(x => !riftLang || x.langs.some(v => v.lang === riftLang))
      .sort((a,b) => b.langs.length - a.langs.length
        || (a.s.order==null?1e9:a.s.order) - (b.s.order==null?1e9:b.s.order));
    h += list.length ? list.map(riftSplitCard).join("") : '<div class="empty">該当なし。</div>';
  }
  $("riftBody").innerHTML = h;
}

  h += '<div style="margin-bottom:8px">' + themeTags(bt.themeIds,true) + '</div>';
  if(bt.note) h += '<details style="margin-bottom:8px"><summary class="sub">'
    + 'この資料についての断り書き</summary><div class="sub" style="margin-top:6px">'
    + esc(bt.note) + '</div></details>';
  /* 元ページ画像のボタンは撤去(2026-09-09)。ページ数は上の見出しに出ている。
     戻すなら下を復活させる。
  if(imgs.length) h += '<div style="margin-bottom:10px">' + imgs.map((i,n)=>
      '<button class="btn" style="margin:0 6px 6px 0" onclick="openImage(\''+esc(i.id)+'\')">'
      + (n ? '別の撮影' + (imgs.length>2 ? ' '+n : '') : '元ページを見る')
      + (i.page?' p.'+esc(i.page):'')+'</button>').join("") + '</div>';
  */
  /* DKのような多言語の本でだけ、行ごとに言語を出す。1言語の本では毎行同じ字が並ぶだけ。 */
  const multiLang = new Set(es.map(e=>e.lang)).size > 1;
  h += '<div class="card">' + (es.length ? es.map(e=>{
    const sn = sense(e.senseId) || {name:"?"};
    return '<div class="entry">'
      + (multiLang ? '<div class="langname">'+esc(e.lang)+'</div>' : '')
      + (e.kind === "pattern" ? '<div class="kindmark">構文枠</div>' : '')
      + (e.status==="present" || !e.status
         ? '<div class="term">'+esc(e.term)+'</div>' + readingHtml(e)
         : (e.status==="absent_in_source"
            ? '<div class="state miss">この資料には載っていない</div>'
            : '<div class="state none">対応する語が<b>ない</b>と資料が述べている</div>'))
      + sourceFormHtml(e)
      + '<div class="ja">'+esc(sn.name)+(e.ja&&e.ja!==sn.name?' — '+esc(e.ja):'')+'</div>'
      + (e.note?'<div class="sub">'+esc(e.note)+'</div>':'')
      + flagsHtml(e)
      + '<div class="srcline"><button onclick="openSense(\''+esc(e.senseId)+'\')">'
      + '他の言語と比べる</button></div>'
      + '</div>';
  }).join("") : '<div class="empty">語がありません。</div>') + '</div>';
  h += memoBox("bookTheme", id);
  $("btBody").innerHTML = h;
}

/* ---------- 画像 ---------- */
async function renderImage(id){
  const m = byId(db.images,id);
  const el = $("imgBody");
  if(!m){ el.innerHTML = '<div class="empty">見つかりません。</div>'; return; }
  const bt = bookTheme(m.bookThemeId), s = source(m.sourceId);
  el.innerHTML = '<div class="sub">'+esc((s||{}).title||"")+' ／ '+esc((bt||{}).name||"")
    + (m.page?' p.'+esc(m.page):'')+'</div><div class="sub">読み込み中…</div>';
  if(m.url){
    el.innerHTML = '<div class="sub">'+esc((s||{}).title||"")+' ／ '+esc((bt||{}).name||"")
      + (m.page?' p.'+esc(m.page):'')+'</div>'
      + (m.note ? '<div class="sub">'+esc(m.note)+'</div>' : '')
      + '<div class="sub" style="margin-bottom:6px">拡大は端末のピンチ操作で。</div>'
      + '<img class="page" src="'+esc(m.url)+'" alt="">';
    return;
  }
  try{
    const data = await idbGet(ST_IMG, id);
    el.innerHTML = '<div class="sub">'+esc((s||{}).title||"")+' ／ '+esc((bt||{}).name||"")
      + (m.page?' p.'+esc(m.page):'')+'</div>'
      + (data ? '<img class="page" src="'+data+'" alt="">' : '<div class="empty">画像が見つかりません。</div>');
  }catch(e){ el.innerHTML = '<div class="msg err">画像を読めません: '+esc(e.message)+'</div>'; }
}

/* ---------- 観察メモ ---------- */
/* ---------- コレクション（2026-09-12にMayの依頼） ----------
   その日の出来事に合わせて、テーマをまたいで比較項目を集める「プレイリスト」。
   **語を複製しない。** 集めるのは意味(sense)のidだけで、各言語の語は今までどおり比較画面で見る。
   同じ意味を複数のコレクションに入れてよい。コレクションを消しても語・意味・テーマ・メモは消えない。
   タブは増やさず、「メモ」タブの中で切り替える（iPhoneの幅で6つ目のタブが入らないため）。 */
let colFormOpen = false;        // 一覧で「コレクションを作る」を押したか
let colEditId = "";             // 詳細で編集中のコレクション
let colPickFor = "";            // 比較画面で「入れる先を選ぶ」を開いている意味

const collection = id => byId(db.collections, id);
/* 「いま集めているコレクション」(2026-09-12g)。選んでおくと、語の一覧と比較画面に＋が出て
   1タップで入れられる。選んでいなくても、今までどおり比較画面の「＋ コレクションに入れる」から入れられる。 */
function activeCol(){ return collection(db.activeCol || ""); }
function colSetActive(id){
  db.activeCol = (db.activeCol === id) ? "" : id;
  save();
  if(id && db.activeCol) renderCol(id); else if(id) renderCol(id);
}
/* 一覧の＋。押した場所だけ描き替える（一覧を作り直すとスクロールが飛ぶ） */
function colQuick(btn, senseId){
  const c = activeCol(); if(!c) return;
  const has = (c.items||[]).includes(senseId);
  if(has) colRemove(c.id, senseId); else colAdd(c.id, senseId);
  const now = (collection(c.id).items||[]).includes(senseId);
  btn.textContent = now ? "✓" : "＋";
  btn.className = "iconbtn" + (now ? " on" : "");
  btn.title = now ? "集め先から外す" : ("「"+c.title+"」に入れる");
  const bar = $("colBar"); if(bar) bar.innerHTML = colBarHtml();
}
function colBarHtml(){
  const c = activeCol();
  if(!c) return "";
  return '<span class="sub grow">集め先：<b>'+esc(c.title)+'</b>（'+((c.items||[]).length)+'項目）</span>'
    + '<button class="btn" onclick="openCollection(\''+esc(c.id)+'\')">開く</button>'
    + '<button class="btn" onclick="db.activeCol=\'\';save();renderWords()">やめる</button>';
}
/* 一覧のカードに出す＋ */
function colPlusHtml(senseId){
  const c = activeCol(); if(!c) return "";
  const has = (c.items||[]).includes(senseId);
  return '<button class="iconbtn'+(has?" on":"")+'" title="'+esc(has?"集め先から外す":("「"+c.title+"」に入れる"))
    + '" onclick="event.stopPropagation();colQuick(this,\''+esc(senseId)+'\')">'+(has?"✓":"＋")+'</button>';
}
function colOf(senseId){ return db.collections.filter(c => (c.items||[]).includes(senseId)); }
function fmtDate(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||""));
  return m ? (m[1]+"年"+Number(m[2])+"月"+Number(m[3])+"日") : String(v||"");
}
function today(){ const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function colCreate(title, date, note){
  title = String(title||"").trim();
  if(!title) return null;
  const c = {id:"c:"+uid(), title, date: String(date||"") || today(), note:String(note||"").trim(),
             items:[], at:Date.now(), updated:Date.now()};
  db.collections.unshift(c); save();
  return c;
}
function colAdd(colId, senseId){
  const c = collection(colId); if(!c || !sense(senseId)) return false;
  if(!Array.isArray(c.items)) c.items = [];
  if(c.items.includes(senseId)) return false;   // 同じ意味は二重に入れない
  c.items.push(senseId); c.updated = Date.now(); save();
  return true;
}
function colRemove(colId, senseId){
  const c = collection(colId); if(!c) return;
  c.items = (c.items||[]).filter(x => x !== senseId); c.updated = Date.now(); save();
}
/* 比較画面から。入っていれば外す、入っていなければ入れる */
function colToggleFromSense(colId, senseId){
  const c = collection(colId); if(!c) return;
  if((c.items||[]).includes(senseId)) colRemove(colId, senseId); else colAdd(colId, senseId);
  renderSense(senseId);
}
function colNewFromSense(senseId){
  const v = ($("colNewTitle")||{}).value || "";
  if(!String(v).trim()){ return; }
  const c = colCreate(v, today(), "");
  if(c) colAdd(c.id, senseId);
  renderSense(senseId);
}
function colMove(colId, i, d){
  const c = collection(colId); if(!c) return;
  const a = c.items||[]; const j = i + d;
  if(j < 0 || j >= a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t; c.updated = Date.now(); save(); renderCol(colId);
}
function colRemoveAt(colId, i){
  const c = collection(colId); if(!c) return;
  (c.items||[]).splice(i,1); c.updated = Date.now(); save(); renderCol(colId);
}
function colSaveMeta(colId){
  const c = collection(colId); if(!c) return;
  const t = ($("colTitle").value||"").trim();
  if(!t){ alert("タイトルを入れてください。"); return; }
  c.title = t; c.date = $("colDate").value || c.date; c.note = ($("colNote").value||"").trim();
  c.updated = Date.now(); save(); colEditId = ""; renderCol(colId);
}
function colDelete(colId){
  const c = collection(colId); if(!c) return;
  if(!confirm("コレクション「"+c.title+"」を消します。集めた語・意味・テーマ・メモは消えません。よろしいですか。")) return;
  db.collections = db.collections.filter(x => x.id !== colId); save();
  goBack();
}

/* 一覧（メモタブの中） */
function colSort(a,b){
  const d = String(b.date||"").localeCompare(String(a.date||""));
  return d || (b.at||0) - (a.at||0);
}
function colCardHtml(c){
  const n = (c.items||[]).length;
  return '<div class="card tap" onclick="openCollection(\''+esc(c.id)+'\')">'
    + '<div class="row"><b class="grow">'+esc(c.title)+'</b>'
    + (db.activeCol===c.id ? '<span class="tag">集め先</span>' : '')
    + '<span class="sub">'+n+'項目</span></div>'
    + '<div class="sub">'+esc(fmtDate(c.date))+'</div>'
    + (c.note ? '<div class="sub" style="margin-top:3px; white-space:pre-wrap">'+esc(c.note)+'</div>' : '')
    + '</div>';
}
function colFormHtml(){
  return '<div class="card">'
    + '<div class="sub" style="margin-bottom:6px">タイトル</div>'
    + '<input type="text" id="colFTitle" placeholder="例：娘の運動会">'
    + '<div class="sub" style="margin:8px 0 6px">日付</div>'
    + '<input type="date" id="colFDate" value="'+esc(today())+'">'
    + '<div class="sub" style="margin:8px 0 6px">メモ（その日の出来事）</div>'
    + '<textarea id="colFNote" placeholder="例：一人なら踊れるけれど、みんなと一緒だと恥ずかしいと言っていた日"></textarea>'
    + '<div class="row" style="margin-top:8px">'
    + '<button class="btn pri" onclick="colFormSubmit()">作る</button>'
    + '<button class="btn" onclick="colFormOpen=false;renderCols()">やめる</button></div></div>';
}
function colFormSubmit(){
  const c = colCreate($("colFTitle").value, $("colFDate").value, $("colFNote").value);
  if(!c){ alert("タイトルを入れてください。"); return; }
  colFormOpen = false; renderCols(); openCollection(c.id);
}
function renderCols(){
  const el = $("colList");
  let h = "";
  if(!db.collections.length && !colFormOpen){
    h = '<div class="empty">今日気になったことばを集めてみましょう。<br>'
      + 'テーマをまたいで比較項目を束ねられます。語は複製されません。</div>'
      + '<button class="btn pri" onclick="colFormOpen=true;renderCols()">コレクションを作る</button>';
    el.innerHTML = h; return;
  }
  h += '<div class="row" style="margin-bottom:9px">'
    + '<button class="btn pri" onclick="colFormOpen=true;renderCols()">コレクションを作る</button></div>';
  if(colFormOpen) h += colFormHtml();
  h += '<div class="colgrid">'
    + db.collections.slice().sort(colSort).map(colCardHtml).join("") + '</div>';
  el.innerHTML = h;
  if(colFormOpen && $("colFTitle")) $("colFTitle").focus();
}

/* 詳細 */
function colItemHtml(c, senseId, i, n){
  const s = sense(senseId);
  const btns = '<button class="iconbtn" onclick="event.stopPropagation();colMove(\''+esc(c.id)+'\','+i+',-1)"'
      + (i===0?' disabled':'')+' title="上へ">↑</button>'
    + '<button class="iconbtn" onclick="event.stopPropagation();colMove(\''+esc(c.id)+'\','+i+',1)"'
      + (i===n-1?' disabled':'')+' title="下へ">↓</button>'
    + '<button class="iconbtn warn" onclick="event.stopPropagation();colRemoveAt(\''+esc(c.id)+'\','+i+')" title="外す">✕</button>';
  if(!s){
    /* 取り込み直しで比較キーが変わると、指していた意味が無くなることがある。黙って消さずに出す */
    return '<div class="colitem"><div class="grow"><b>（見つかりません）</b>'
      + '<div class="sub">'+esc(senseId)+'</div></div>'+btns+'</div>';
  }
  /* 比較キーが無い項目（solo）は、同じ日本語ラベルの一群でまとめて数える(2026-09-12g)。
     「恥ずかしい」は5冊に1語ずつあって、そのままだと「1言語」に見えてしまう。
     統合はしない。数え方と見せ方だけ、一覧のカードと同じにそろえる。 */
  const grp = s.solo ? [s].concat(sameLabel(s.id)) : [s];
  const ls = s.solo ? [...labelGroupLangs(s.id)] : langsOf(s.id);
  const terms = [];
  grp.forEach(x => x && entriesOf(x.id).forEach(e => {
    if(e.status === "present" && e.term && terms.length < 4) terms.push(e.term); }));
  const preview = terms.map(esc).join(" ・ ") + (ls.length > 4 ? " …" : "");
  return '<div class="colitem tap" onclick="openSense(\''+esc(s.id)+'\')">'
    + '<div class="grow"><b>'+esc(s.name)+'</b> <span class="sub">'+ls.length+'言語'
    + (s.solo && ls.length > 1 ? '（ラベル一致）' : '')+'</span>'
    + (preview ? '<div class="sub" style="font-size:13.5px">'+preview+'</div>' : '') + '</div>'
    + btns + '</div>';
}
function renderCol(id){
  const c = collection(id);
  if(!c){ $("colBody").innerHTML = '<div class="empty">見つかりません。</div>'; return; }
  const items = c.items || [];
  let h = "";
  if(colEditId === id){
    h += '<div class="card">'
      + '<div class="sub" style="margin-bottom:6px">タイトル</div>'
      + '<input type="text" id="colTitle" value="'+esc(c.title)+'">'
      + '<div class="sub" style="margin:8px 0 6px">日付</div>'
      + '<input type="date" id="colDate" value="'+esc(c.date||"")+'">'
      + '<div class="sub" style="margin:8px 0 6px">メモ</div>'
      + '<textarea id="colNote">'+esc(c.note||"")+'</textarea>'
      + '<div class="row" style="margin-top:8px">'
      + '<button class="btn pri" onclick="colSaveMeta(\''+esc(id)+'\')">保存</button>'
      + '<button class="btn" onclick="colEditId=\'\';renderCol(\''+esc(id)+'\')">やめる</button></div></div>';
  }else{
    h += '<div class="row" style="margin-bottom:4px"><h2 class="grow" style="margin:0">'+esc(c.title)+'</h2>'
      + '<button class="btn" onclick="colEditId=\''+esc(id)+'\';renderCol(\''+esc(id)+'\')">編集</button></div>'
      + '<div class="sub">'+esc(fmtDate(c.date))+' ／ '+items.length+'項目</div>'
      + (c.note ? '<div class="sub" style="margin:6px 0 0; white-space:pre-wrap">'+esc(c.note)+'</div>' : '')
      /* 集め先にしておくと、語の一覧に＋が出て1タップで入れられる(2026-09-12g) */
      + '<div class="row" style="margin-top:8px">'
      + '<button class="btn'+(db.activeCol===id?"":" pri")+'" onclick="colSetActive(\''+esc(id)+'\')">'
      + (db.activeCol===id ? "集めるのをやめる" : "このコレクションに集める")+'</button>'
      + (db.activeCol===id ? '<span class="sub">語の一覧に＋が出ます</span>' : '')+'</div>';
  }
  h += '<h2 style="margin:14px 0 6px">集めた比較項目</h2>';
  h += items.length
    ? '<div class="card">' + items.map((x,i)=>colItemHtml(c,x,i,items.length)).join("") + '</div>'
    : '<div class="empty">まだ何も入っていません。<br>'
      + '語の比較画面を開いて「コレクションに入れる」から足せます。</div>';
  h += '<div class="row" style="margin-top:14px">'
    + '<button class="btn warn" onclick="colDelete(\''+esc(id)+'\')">このコレクションを消す</button></div>'
    + '<div class="sub" style="margin-top:6px">消しても、集めた語・意味・テーマ・メモは残ります。</div>';
  $("colBody").innerHTML = h;
}

/* 比較画面に出す「コレクションに入れる」 */
function colBoxHtml(senseId){
  const inn = colOf(senseId);
  let h = '<div style="margin-bottom:8px">';
  const ac = activeCol();
  if(ac){
    const has = (ac.items||[]).includes(senseId);
    h += '<div class="row" style="margin-bottom:6px">'
      + '<button class="btn'+(has?"":" pri")+'" onclick="colToggleFromSense(\''+esc(ac.id)+'\',\''
        + esc(senseId)+'\')">'+(has ? "✓ 「"+esc(ac.title)+"」に入っています（外す）"
                                     : "＋ 「"+esc(ac.title)+"」に入れる")+'</button></div>';
  }
  if(inn.length){
    h += '<div class="sub" style="margin-bottom:4px">入っているコレクション</div>'
      + inn.map(c => '<span class="tag tap" onclick="openCollection(\''+esc(c.id)+'\')">'
          + esc(c.title)+'</span>').join("");
  }
  const open = colPickFor === senseId;
  h += '<details class="sect"'+(open?' open':'')
    + ' ontoggle="colPickFor = this.open ? \''+esc(senseId)+'\' : \'\'">'
    + '<summary class="ghead" style="font-size:13px; padding:7px 2px">＋ コレクションに入れる</summary>';
  h += '<div class="card" style="margin-top:6px">';
  if(db.collections.length){
    h += db.collections.slice().sort(colSort).map(c=>{
      const has = (c.items||[]).includes(senseId);
      return '<div class="colitem"><div class="grow"><b>'+esc(c.title)+'</b>'
        + '<div class="sub">'+esc(fmtDate(c.date))+' ／ '+((c.items||[]).length)+'項目</div></div>'
        + '<button class="btn'+(has?"":" pri")+'" onclick="colToggleFromSense(\''+esc(c.id)+'\',\''
          + esc(senseId)+'\')">'+(has?"外す":"入れる")+'</button></div>';
    }).join("");
    h += '<div class="colitem"><div class="grow"><input type="text" id="colNewTitle" placeholder="新しいコレクション名"></div>'
      + '<button class="btn" onclick="colNewFromSense(\''+esc(senseId)+'\')">作って入れる</button></div>';
  }else{
    h += '<div class="sub" style="margin-bottom:6px">まだコレクションがありません。</div>'
      + '<div class="row"><input type="text" id="colNewTitle" class="grow" placeholder="例：娘の運動会">'
      + '<button class="btn pri" onclick="colNewFromSense(\''+esc(senseId)+'\')">作って入れる</button></div>';
  }
  h += '</div></details></div>';
  return h;
}

function memosFor(tType,tId){ return db.memos.filter(m=>m.tType===tType && m.tId===tId); }
function memoBox(tType,tId){
  const ms = memosFor(tType,tId);
  return '<h2 style="margin-top:16px">観察メモ</h2>'
    + ms.map(m=>'<div class="card"><div style="white-space:pre-wrap">'+esc(m.text)+'</div>'
        + '<div class="row" style="margin-top:6px"><span class="sub grow">'+esc(fmtAt(m.at))+'</span>'
        + '<button class="btn warn" onclick="delMemo(\''+esc(m.id)+'\')">消す</button></div></div>').join("")
    + '<textarea id="memoIn" placeholder="気づいたこと・疑問"></textarea>'
    + '<div class="row" style="margin-top:6px"><button class="btn pri" onclick="addMemo(\''
      + esc(tType)+'\',\''+esc(tId)+'\')">メモを足す</button></div>';
}
function fmtAt(t){ const d = new Date(t||0);
  return isNaN(d) ? "" : d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"
    +String(d.getDate()).padStart(2,"0"); }
function addMemo(tType,tId){
  const v = ($("memoIn").value||"").trim();
  if(!v) return;
  db.memos.unshift({id:uid(), tType, tId, text:v, at:Date.now()});
  save();
  if(tType==="sense") renderSense(tId); else if(tType==="bookTheme") renderBt(tId);
}
function delMemo(id){
  const m = byId(db.memos,id); if(!m) return;
  if(!confirm("このメモを消します。よろしいですか。")) return;
  db.memos = db.memos.filter(x=>x.id!==id); save();
  if(m.tType==="sense") renderSense(m.tId);
  else if(m.tType==="bookTheme") renderBt(m.tId);
  else renderMemos();
}
function memoTargetLabel(m){
  if(m.tType==="sense"){ const s=sense(m.tId); return s?("語："+s.name):"（消えた語）"; }
  if(m.tType==="bookTheme"){ const b=bookTheme(m.tId);
    const s=b&&source(b.sourceId); return b?("本："+(s?s.title+" / ":"")+b.name):"（消えた本のテーマ）"; }
  if(m.tType==="theme"){ const t=theme(m.tId); return t?("テーマ："+t.name):"（消えたテーマ）"; }
  return m.tType;
}
/* コレクションは独立したタブにした(2026-09-12g)。メモタブは元どおり気づきメモだけ。 */
function renderMemos(){ renderMemoList(); }
function renderMemoList(){
  const el = $("memoList");
  if(!db.memos.length){
    el.innerHTML = '<div class="empty">まだメモがありません。語や本のテーマの画面から書けます。</div>';
    return;
  }
  el.innerHTML = db.memos.slice().sort((a,b)=>b.at-a.at).map(m=>{
    const jump = m.tType==="sense" ? 'openSense(\''+esc(m.tId)+'\')'
               : m.tType==="bookTheme" ? 'openBookTheme(\''+esc(m.tId)+'\')' : '';
    return '<div class="card'+(jump?' tap':'')+'"'+(jump?' onclick="'+jump+'"':'')+'>'
      + '<div class="sub">'+esc(memoTargetLabel(m))+'</div>'
      + '<div style="white-space:pre-wrap; margin-top:3px">'+esc(m.text)+'</div>'
      + '<div class="sub" style="margin-top:4px">'+esc(fmtAt(m.at))+'</div></div>';
  }).join("");
}

/* ---------- 取り込み ---------- */
function upsertTheme(name, atlas, note){
  name = String(name||"").trim(); if(!name) return null;
  let t = byId(db.themes, tid(name));
  if(!t){ t = {id:tid(name), name, atlas:atlas||(ATLAS_CONCEPTS.includes(name)?name:""),
               note:note||"", notes:[]};
          db.themes.push(t); return t; }
  if(!Array.isArray(t.notes)) t.notes = [];
  if(atlas) t.atlas = atlas;
  if(note)  t.note  = note;
  return t;
}
/* 意味（比較の軸）。key は言語をまたぐ安定キー。
   素材の comparison_key のように表示名と別のキーがあるときは key を渡す。
   key が無ければ表示名そのものがキーになる。 */
function upsertSense(name, themeIds, note, opt){
  opt = opt || {};
  name = String(name||"").trim();
  const key = String(opt.key || name).trim();
  if(!key) return null;
  let s = byId(db.senses, sid(key));
  if(!s){
    s = {id:sid(key), key, name:name||key, solo:!!opt.solo, order:null, note:note||"", themeIds:[]};
    db.senses.push(s);
  }
  if(name && !s.name) s.name = name;
  if(opt.solo) s.solo = true;
  if(opt.order != null && s.order == null) s.order = Number(opt.order);
  (themeIds||[]).forEach(t => { if(!s.themeIds.includes(t)) s.themeIds.push(t); });
  if(note && !s.note) s.note = note;
  return s;
}
function upsertLang(l){
  l = toNative(l); if(!l) return "";
  if(!db.langs.includes(l)) db.langs.push(l);
  return l;
}

function importData(text){
  labelIndex = null; entryIndex = null; termIndex = null;   // 意味も語も増減するので索引を作り直させる
  const raw = JSON.parse(text);
  const blocks = Array.isArray(raw) ? raw : (Array.isArray(raw.imports) ? raw.imports : [raw]);
  const c = {src:0, bt:0, theme:0, sense:0, add:0, repl:0, memo:0, memoSame:0, themeNote:0,
             col:0, colItem:0, colKept:0};
  const errors = [];
  // メモは全ブロックを読み終えてから入れる。宛先の意味は後ろのブロックの語で作られることがあるため(2026-09-11)
  const pendingMemos = [];
  const pendingCols = [];   // コレクションも同じ理由で後から(2026-09-12)

  blocks.forEach((b, bi)=>{
    const where = "ブロック" + (bi+1);

    (b.langs||[]).forEach(upsertLang);

    (b.themes||[]).forEach(t=>{
      const name = typeof t === "string" ? t : t.name;
      const before = db.themes.length;
      upsertTheme(name, t.atlas, t.note);
      if(db.themes.length > before) c.theme++;
    });

    (b.senses||[]).forEach(s=>{
      const tIds = (s.themes||[]).map(n=>{
        const before = db.themes.length; const t = upsertTheme(n);
        if(db.themes.length>before) c.theme++; return t && t.id;
      }).filter(Boolean);
      const before = db.senses.length;
      upsertSense(s.name, tIds, s.note);
      if(db.senses.length > before) c.sense++;
    });

    (b.themeNotes||[]).forEach(tn=>{
      const t = upsertTheme(tn.theme);
      if(!t){ errors.push(where+": themeNotes の theme 名が空です。"); return; }
      t.notes = (t.notes||[]).filter(x => !(x.lang===tn.lang && x.status===tn.status));
      t.notes.push({lang:tn.lang||"", status:tn.status||"", note:tn.note||""});
      c.themeNote++;
    });

    (b.memos||[]).forEach(mm => pendingMemos.push({mm, where}));
    (b.collections||[]).forEach(cc => pendingCols.push({cc, where}));

    if(!b.source && !b.items) return;
    if(!b.source || !b.source.id || !b.source.title){
      errors.push(where+": source に id と title が要ります。"); return;
    }
    let s = byId(db.sources, b.source.id);
    if(!s){ s = {id:b.source.id, title:"", kind:"", lang:"", edition:"", note:""};
            db.sources.push(s); c.src++; }
    s.title = b.source.title;
    s.kind    = b.source.kind    || s.kind;
    s.lang    = b.source.lang ? toNative(b.source.lang) : s.lang;
    s.edition = b.source.edition || s.edition;
    s.note    = b.source.note    || s.note;
    if(s.lang) upsertLang(s.lang);

    if(!b.bookTheme || !b.bookTheme.name){
      errors.push(where+": bookTheme に name が要ります。"); return;
    }
    const btIdV = btid(s.id, b.bookTheme.name);
    let bt = byId(db.bookThemes, btIdV);
    if(!bt){ bt = {id:btIdV, sourceId:s.id, name:b.bookTheme.name, page:"", themeIds:[], note:""};
             db.bookThemes.push(bt); c.bt++; }
    if(b.bookTheme.page != null) bt.page = String(b.bookTheme.page);
    if(b.bookTheme.note) bt.note = b.bookTheme.note;
    /* 元ページ画像を配信ファイルとして持つ場合（IndexedDBに入れない）。
       取り込み直しても増えないよう、bookThemeごとに1件に固定する。 */
    /* 元ページ画像は撤去した(2026-09-09にMayが判断。「見にいかない。本を見に行けるよう
       ページ数があれば十分」)。取り込み由来の画像レコードはここで掃除する。
       手で入れた画像（url なし）は消さない。
       戻すなら、下のコメントを復活させ、変換スクリプトの IMG_DIR まわりも戻す。 */
    db.images = db.images.filter(x => !(x.bookThemeId === btIdV && x.url));
    /*
    const btImgs = [];
    if(b.bookTheme.image) btImgs.push({file:b.bookTheme.image, note:""});
    (b.bookTheme.images||[]).forEach(x=>{
      if(x && x.file) btImgs.push({file:x.file, note:x.note||""});
    });
    btImgs.forEach((x,i)=>{
      db.images.push({id:"img:" + btIdV + (i ? "#" + i : ""),
                      sourceId:s.id, bookThemeId:btIdV,
                      page:String(b.bookTheme.page||""), name:x.file,
                      url:x.file, note:x.note||"", at:Date.now()});
    });
    */
    const btThemeIds = (b.bookTheme.themes||[]).map(n=>{
      const before = db.themes.length; const t = upsertTheme(n);
      if(db.themes.length>before) c.theme++; return t && t.id;
    }).filter(Boolean);
    btThemeIds.forEach(id=>{ if(!bt.themeIds.includes(id)) bt.themeIds.push(id); });

    /* 同じ本・同じテーマの語は丸ごと差し替える（取り込み直しても増殖しない）。
       メモは意味・テーマ・本のテーマに付いているので、ここでは消えない。 */
    const old = db.entries.filter(e => e.bookThemeId === btIdV);
    c.repl += old.length;
    db.entries = db.entries.filter(e => e.bookThemeId !== btIdV);

    (b.items||[]).forEach((it, ii)=>{
      const at = where + " items[" + ii + "]";
      const senseName = String(it.sense||"").trim();
      const senseKey  = String(it.senseKey||"").trim();
      if(!senseName && !senseKey){ errors.push(at+": sense（意味の名前）が空です。"); return; }
      const lang = toNative(it.lang || s.lang);
      if(!lang){ errors.push(at+": 言語が決まりません（source.lang か item.lang）。"); return; }
      upsertLang(lang);
      const itemThemeIds = (it.themes||[]).map(n=>{
        const before = db.themes.length; const t = upsertTheme(n);
        if(db.themes.length>before) c.theme++; return t && t.id;
      }).filter(Boolean);
      const before = db.senses.length;
      const sn = upsertSense(senseName || senseKey, btThemeIds.concat(itemThemeIds), it.senseNote,
                             {key:senseKey, solo:!!it.solo, order:it.order});
      if(db.senses.length > before) c.sense++;

      const status = it.status || (it.term ? "present" : "");
      if(!status){ errors.push(at+": term が無く status も無いので、何を言っているのか決まりません。"); return; }
      if(status === "present" && !it.term){ errors.push(at+": term が空です。"); return; }
      if(status === "no_expression" && !it.note)
        errors.push(at+": 「対応する語がない」には根拠のnoteを付けてください（取り込みは続けます）。");

      /* srcId（素材側のレコードID）があればそれを識別子にする。
         取り込み直しても、素材のIDが同じかぎり同じentryになる。 */
      db.entries.push({
        id: it.srcId ? ("e:" + it.srcId) : eid(s.id, lang, sn.id, it.term || status),
        srcId: it.srcId || "",
        senseId: sn.id, lang,
        term: it.term || "", reading: it.reading || "",
        readingSrc: it.readingSrc === "added" ? "added" : "book",
        readingStatus: it.readingStatus || "",
        readingLevel: it.readingLevel || "",
        readingNote: it.readingNote || "",
        readingParts: Array.isArray(it.readingParts) ? it.readingParts.slice() : [],
        ja: it.ja || "", note: it.note || "",
        kind: it.kind === "pattern" ? "pattern" : "term",
        flags: Array.isArray(it.flags) ? it.flags.slice() : [],
        reviewNote: it.reviewNote || "",
        reviewRef: it.reviewRef || "",
        opposite: it.opposite || "",
        section: it.section || "",
        register: it.register || "",
        aspect: it.aspect || "",
        normalizedText: it.normalizedText || "",
        sourceNumeric: (it.sourceNumeric != null ? Number(it.sourceNumeric) : null),
        verifiedNumeric: (it.verifiedNumeric != null ? Number(it.verifiedNumeric) : null),
        headword: it.headword || "",
        gender: it.gender || "",
        numeric: (it.numeric != null ? Number(it.numeric) : null),
        sourceId: s.id, bookThemeId: btIdV,
        page: it.page != null ? String(it.page) : (bt.page || ""),
        status
      });
      c.add++;
    });
  });

  pendingMemos.forEach(({mm, where})=>{
    const t = String(mm.target||"");
    const i = t.indexOf(":");
    const kind = t.slice(0,i), name = t.slice(i+1);
    const tId = kind==="sense" ? sid(name) : kind==="theme" ? tid(name) : null;
    if(!tId){ errors.push(where+": メモの対象 '"+t+"' が読めません（sense:比較キー / theme:名前）"); return; }
    // 宛先が無いメモは入れない。入れると、どの画面にも出ない孤児になる(2026-09-11)
    const target = kind==="sense" ? byId(db.senses, tId) : byId(db.themes, tId);
    if(!target){ errors.push(where+": メモの宛先 '"+t+"' が見つかりません（意味は比較キーで指す: sense:比較キー）"); return; }
    const text = String(mm.text||"");
    if(!text.trim()){ errors.push(where+": メモの本文が空です（"+t+"）"); return; }
    // 同じ宛先に同じ文面があれば二重に入れない。同梱データを読み込み直しても増えない(2026-09-11)
    if(db.memos.some(x => x.tType===kind && x.tId===tId && x.text===text)){ c.memoSame++; return; }
    db.memos.unshift({id:uid(), tType:kind, tId, text, at:Date.now()});
    c.memo++;
  });

  /* 配るコレクション(2026-09-12)。key から id が決まるので、読み込み直しても増えない。
     **利用者が作ったコレクションには触らない**（idが "c:<ランダム>" で別物）。
     **すでにある枠には一切触らない。** 項目を入れるのは、その枠を新しく作ったときだけ。
     外した項目を戻したり、直したタイトル・並び順を上書きしたりしない
     （2026-09-12。足りない項目を足す作りにしたら、利用者が外した語が戻ってきたのでやめた）。 */
  pendingCols.forEach(({cc, where})=>{
    const key = String(cc.key||"").trim();
    if(!key){ errors.push(where+": コレクションに key が要ります（idの元になります）"); return; }
    const title = String(cc.title||"").trim();
    if(!title){ errors.push(where+": コレクション '"+key+"' に title が要ります"); return; }
    const id = "c:" + key;
    let col = byId(db.collections, id);
    if(col){ c.colKept++; return; }   // すでにある枠は触らない
    col = {id, title, date:String(cc.date||""), note:String(cc.note||""),
           items:[], at:Date.now(), updated:Date.now()};
    db.collections.unshift(col); c.col++;
    (cc.items||[]).forEach(x=>{
      const senseId = String(x||"").trim();
      if(!senseId) return;
      // 無い意味は入れない。入れると「（見つかりません）」だけが並ぶ
      if(!byId(db.senses, senseId)){
        errors.push(where+": コレクション '"+title+"' の項目 '"+senseId+"' が見つかりません"); return;
      }
      if(col.items.includes(senseId)) return;
      col.items.push(senseId); c.colItem++;
    });
  });

  labelIndex = null; entryIndex = null; termIndex = null;   // 取り込みで中身が変わったので捨てる
  const summary =
    "取り込み完了: 語 " + c.add + "件（同じ本の同じテーマから " + c.repl + "件を差し替え）\n"
    + "新規: 本 " + c.src + " / 本のテーマ " + c.bt + " / 共通テーマ " + c.theme
    + " / 意味 " + c.sense + " / メモ " + c.memo
    + (c.memoSame ? "（同じ文面の " + c.memoSame + "件は入れていない）" : "")
    + (c.themeNote ? " / テーマの在否メモ " + c.themeNote : "")
    + (c.col || c.colKept ? " / コレクション " + c.col + "（項目 " + c.colItem + "件"
        + (c.colKept ? "・すでにある " + c.colKept + "件はそのまま" : "") + "）" : "");
  return {summary, errors, counts:c};
}

/* アプリと同じ場所の prism-data.json を取り込む。
   iPhoneで400KBのJSONを貼るのは現実的でないため（2026-09-06）。
   ファイルが無いときは黙って何もせず、理由を画面に出す。 */
async function loadBundled(){
  const m = $("impMsg");
  m.className = "msg"; m.textContent = "読み込み中…";
  let text;
  try{
    const res = await fetch("./prism-data.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    text = await res.text();
  }catch(e){
    m.className = "msg err";
    m.textContent = "prism-data.json を読めません（" + e.message + "）。\n"
      + "アプリと同じ場所にファイルが置かれているか確認してください。";
    return;
  }
  await makeUndo();
  try{
    const r = importData(text);
    m.className = r.errors.length ? "msg err" : "msg ok";
    m.textContent = r.summary + (r.errors.length ? "\n\n問題:\n" + r.errors.join("\n") : "");
    save(); renderSettings();
  }catch(e){
    m.className = "msg err"; m.textContent = "取り込めません: " + e.message;
  }
}

/* ---------- 書き出し ---------- */
function download(name, text, type){
  const b = new Blob([text], {type: type || "application/json"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 500);
}
function stamp(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function doExport(){
  const t = JSON.stringify(db, null, 1);
  download("prism-"+stamp()+".json", t);
  $("expMsg").className="msg ok";
  $("expMsg").textContent = "書き出しました（" + Math.round(t.length/1024) + " KB）。画像は含みません。";
}
/* Atlas の「取込」タブに貼れる ◇概念 の下書きを作る。
   中身は自動生成せず、こちらで見つけた語を並べるだけ。文章はMayが書く。 */
function doExportAtlas(){
  const out = {grammar:[]};
  db.themes.forEach(t=>{
    if(!ATLAS_CONCEPTS.includes(t.name)) return;
    const senses = db.senses.filter(s=>(s.themeIds||[]).includes(t.id));
    let body = "【Prismから】" + t.name + " に集めた語（" + stamp() + "時点）\n\n";
    senses.forEach(s=>{
      body += "◆ " + s.name + "\n";
      db.langs.forEach(l=>{
        const es = entriesOf(s.id,l).filter(e=>e.status==="present");
        if(!es.length) return;
        body += "  " + l + ": " + es.map(e=>e.term + (e.reading?"（"+e.reading+"）":"")).join(" / ") + "\n";
      });
      body += "\n";
    });
    out.grammar.push({topic:t.name, lang:"", lesson:0, type:"concept", related:[], body, examples:[]});
  });
  if(!out.grammar.length){
    $("expMsg").className="msg err";
    $("expMsg").textContent = "Atlasの◇と同じ名前のテーマがまだありません（"+ATLAS_CONCEPTS.join("・")+"）。";
    return;
  }
  download("prism-to-atlas-"+stamp()+".json", JSON.stringify(out, null, 1));
  $("expMsg").className="msg ok";
  $("expMsg").textContent = "◇" + out.grammar.map(g=>g.topic).join("・")
    + " の下書きを書き出しました。Atlasの「取込」に貼る前に、必ず中身を読んで直してください（既存の◇を上書きします）。";
}

function wipeAll(){
  if(!confirm("すべてのデータを消します。書き出しは済んでいますか。")) return;
  if(!confirm("本当に消しますか。元に戻せません。")) return;
  db = emptyDb(); labelIndex = null; entryIndex = null; termIndex = null; save(); showTab("Settings");
}

/* ---------- Atlasから来たとき ----------
   assimil-phrasebook.html の◇ページのリンク → prism.html#theme=曜日
   同名テーマが無ければテーマ一覧のままにして、理由を出す（黙って無視しない）。 */
function openFromHash(){
  const m = /^#theme=(.+)$/.exec(location.hash || "");
  if(!m) return false;
  let name; try{ name = decodeURIComponent(m[1]); }catch(e){ name = m[1]; }
  const t = byId(db.themes, tid(name));
  if(t){ curTab = "Themes"; openTheme(t.id); return true; }
  showTab("Themes");
  $("themeList").insertAdjacentHTML("afterbegin",
    '<div class="card"><b>「'+esc(name)+'」はまだ取り込んでいません。</b>'
    + '<div class="sub">Atlasの◇にはありますが、こちらにはまだ語がありません。</div></div>');
  return true;
}
window.addEventListener("hashchange", openFromHash);

/* ---------- 起動 ---------- */
(async function boot(){
  try{ await bootStorage(); }
  catch(e){ db = emptyDb(); warnBar("読み込みに失敗しました: " + (e && e.message)); }
  showTab("Themes");
  openFromHash();
})();
